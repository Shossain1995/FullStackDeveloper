<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>SoundWave</h1>
  <section>
    <h2>Blinding Lights</h2>
      <audio controls 
       aria-label="Audio player for Sailing Away by [artist name]">
        <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
        type="audio/mpeg">
        
        </source>
      </audio>
  </section>

   <section>
    <h2>video Player</h2>
    <video controls width="600" aria-label="" >
    <source  src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
    type="video/mp4">
    
    </source>
    <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="subtitles" srclang="en" label="English">
    </track>
  </video>
   </section>

    <section>
      <h2>Transcript</h2>
      <p>element with the transcript of the video.</p>

    </section>
</body>

</html>
